name: Release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: 'Version bump type ("none" republishes what is already on main)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write # npm Trusted Publishing과 MCP Registry 로그인 둘 다 OIDC다 — 토큰 시크릿이 없다

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing은 npm CLI 11.5.1 이상이 필요하다. Node 22에 딸린 npm은 10.x다.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      # prepublishOnly와 같은 검사를 버전을 올리기 전에 돌린다. 버전 커밋을 main에 올린 뒤에
      # 실패하면 그 버전은 "none"으로만 복구할 수 있다. publish는 아래에서 --ignore-scripts로
      # 부르므로 같은 검사가 두 번 돌지 않는다. 서버는 버전을 런타임에 package.json에서
      # 읽으므로(src/server.ts) 버전을 올리기 전에 빌드해도 결과물이 같다.
      - name: Lint, type check, test, build
        run: |
          npm run lint
          npm run type-check
          npm test
          npm run build

      - name: Check package contents
        run: npm run check:pack

      # Skipped for "none", which publishes the version already committed on main.
      # That is the recovery path: a step after the version push can fail, and
      # re-running a bump would strand the half-released version behind a new one.
      # npm version은 커밋과 태그 vX.Y.Z를 함께 만든다. "version" 훅(scripts/sync-version.mjs)이
      # server.json의 버전을 맞춰 같은 커밋에 넣는다.
      - name: Bump version
        if: inputs.version-type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.version-type }} -m "chore: release v%s"

      - name: Resolve version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Push version commit and tag
        if: inputs.version-type != 'none'
        run: git push origin HEAD:main --follow-tags

      # Skipped when the version is already published, so a "none" re-run does not
      # fail on npm's refusal to overwrite a version.
      - name: Check whether the version is already on npm
        id: npm-state
        run: |
          if npm view --prefer-online \
            "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" version > /dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      # 인증은 npm에 등록한 Trusted Publisher(이 저장소 + release.yml)가 OIDC로 한다.
      # 저장소가 private이라 provenance는 붙지 않는다 — npm이 공개 저장소에만 만든다.
      - name: Publish to npm
        if: steps.npm-state.outputs.published != 'true'
        run: npm publish --ignore-scripts

      # npm accepts a publish before the version is readable from the registry.
      # The new version must become "latest", not just exist — npm staged it as
      # 0.0.0-stage on the first publish of this package.
      - name: Wait for npm to serve the version as latest
        run: |
          for attempt in $(seq 1 10); do
            LATEST=$(npm view --prefer-online "${{ steps.version.outputs.name }}" dist-tags.latest 2>/dev/null || true)
            if [ "$LATEST" = "${{ steps.version.outputs.version }}" ]; then
              echo "${{ steps.version.outputs.name }}@$LATEST is latest on npm"
              exit 0
            fi
            echo "attempt $attempt: latest is '$LATEST', retrying in 60s"
            sleep 60
          done
          echo "::error::${{ steps.version.outputs.version }} did not become latest on npm within 10 minutes"
          exit 1

      # 공식 MCP Registry에 등록한다. Registry는 npm 패키지의 mcpName이 server.json의 name과
      # 같은지 보므로 npm 반영을 기다린 뒤에 돈다. 로그인은 GitHub OIDC라 io.github.inavi-systems/*
      # 이름만 쓸 수 있다. "none" 재실행에서 이미 등록된 버전이면 건너뛴다.
      - name: Check whether the version is already on the MCP Registry
        id: registry-state
        run: |
          NAME=$(node -p "require('./server.json').name")
          ENCODED=$(node -p "encodeURIComponent(process.argv[1])" "$NAME")
          if curl -sf "https://registry.modelcontextprotocol.io/v0/servers/$ENCODED/versions/${{ steps.version.outputs.version }}" > /dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Install mcp-publisher
        if: steps.registry-state.outputs.published != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        if: steps.registry-state.outputs.published != 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Summary
        run: |
          echo "### ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tag: \`${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A minor or major release adds a feature, and the generated list of PR titles
      # does not convey one. Open the section here and fill it in afterwards; patch
      # releases keep the generated list on its own.
      - name: Open a Highlights section
        if: inputs.version-type == 'minor' || inputs.version-type == 'major'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release view "$TAG" --json body --jq '.body' > generated-notes.md
          {
            echo "## Highlights"
            echo
            echo "_Pending._"
            echo
            cat generated-notes.md
          } > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
          echo "### Highlights section is empty — fill it in on $TAG" >> "$GITHUB_STEP_SUMMARY"
