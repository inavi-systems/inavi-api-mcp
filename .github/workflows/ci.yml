name: CI

on:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      # 실제 API Key가 필요 없다 — test/setup/env.ts가 가짜 값을 넣는다.
      - name: Run tests
        run: npm test

      # build:ui(Vite → public/ui/map.html)가 build:server보다 먼저 돈다.
      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm run check:pack
